version: "2"
type: frontend
tech_stack:
  - React 18
  - Vite
  - Tailwind CSS v4
  - Zustand
  - Recharts
  - React Router v6
routes:
  - path: /
    file: src/pages/DashboardPage.jsx
    auth_required: false
    description: Financial summary dashboard overview
  - path: /transactions
    file: src/pages/TransactionsPage.jsx
    auth_required: false
    description: Transactions history and management
  - path: /insights
    file: src/pages/InsightsPage.jsx
    auth_required: false
    description: Analytics and financial insights
features:
  - name: Dashboard Viewing
    description: View summary cards, balance trend chart, and spending donut chart
    files:
      - src/pages/DashboardPage.jsx
      - src/components/dashboard/SummaryCard.jsx
      - src/components/dashboard/BalanceTrendChart.jsx
      - src/components/dashboard/SpendingDonutChart.jsx
    entry_route: /
    user_interactions:
      - View overview summary cards
      - Hover over pie chart slices to see tooltip details
      - View recent transactions list
    api_calls: []
    auth_required: false
  - name: Transaction Management
    description: Add, edit, and delete transactions with advanced filtering
    files:
      - src/pages/TransactionsPage.jsx
      - src/components/transactions/TransactionTable.jsx
      - src/components/transactions/AddEditModal.jsx
      - src/components/transactions/FilterBar.jsx
    entry_route: /transactions
    user_interactions:
      - Click 'Add Transaction' button to open modal
      - Fill form fields (description, amount, category, type, date)
      - Click 'Add Transaction' to submit
      - Use filter dropdowns and search bar to filter table
      - Click Edit button on row to edit transaction
      - Click Delete button on row to remove transaction
      - Click 'Clear all' to clear filters
    api_calls: []
    auth_required: false
  - name: Financial Insights
    description: View month-over-month comparisons, anomaly detection, and smart tips
    files:
      - src/pages/InsightsPage.jsx
      - src/components/insights/MonthComparisonChart.jsx
      - src/components/insights/AnomalyAlert.jsx
      - src/components/insights/InsightCard.jsx
    entry_route: /insights
    user_interactions:
      - View top spending category progress bar
      - View month-over-month income vs expense numbers
      - Read spending anomalies alerts and smart tips
    api_calls: []
    auth_required: false
  - name: Global Interactivity
    description: Toggle Dark Mode and switch user roles (Admin/Viewer)
    files:
      - src/components/layout/TopBar.jsx
      - src/components/layout/Sidebar.jsx
    entry_route: /
    user_interactions:
      - Click top right role selector to switch to Viewer
      - Click top right role selector to switch to Admin
      - Click Dark mode toggle button to switch between themes
    api_calls: []
    auth_required: false
known_limitations: []
